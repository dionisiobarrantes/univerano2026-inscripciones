<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html" 
      xmlns:f="http://java.sun.com/jsf/core" >
     
     <h:head>
        <title>Inscripción en la Universidad de Verano Anticapitalista</title>
    </h:head>
    <h:body >
        
<f:view locale="#{facesContext.externalContext.requestLocale}" >
    
      <f:loadBundle basename="resources.mensajes" var="msg"  /> 
      <!-- comment -->
       <table align="center" style="font-family: 'Open Sans', sans-serif;">
       <tr>
        <td align="center">
        <h:graphicImage value="#{facesContext.externalContext.requestContextPath}/../images/banner-2025.jpg"  width="150" height="212" style="vertical-align: middle;"/>    
        </td>
       </tr>
       </table> 
        <h:form >
        <table align="center" style="font-family: 'Open Sans', sans-serif;">
            <tr>
                <td>
                    <br></br> 
                    <br></br>    
                    <h:outputLabel value="#{msg.confirmacion}"  />
                    <br></br> 
                    <br></br>  
                    <h:outputLabel style="font-weight:bold;" value="#{msg.confirmacion1}"  />
                    
                    <h:outputLabel style="font-weight:bold; font-size: 1.5em;" value="#{newJSFManagedBean.inscripcionActual.getIdInscripcion().toString()}"  />
                    <br></br> 
                    <br></br>  
                    <h:outputLabel style="font-weight:bold;" value="#{msg.confirmacion2}"  />
                    <h:outputLabel style="font-weight:bold; font-size: 1.5em;" value="#{newJSFManagedBean.inscripcionActual.getImporteTotal().toString()}"  />
                    <h:outputLabel style="font-weight:bold;" value=" Euros."  />
                    <br></br> 
                    <br></br>  
                    <h:outputLabel value="#{msg.tarifa_m7}#{msg.IBAN}"  />
                    <br></br> 
                    <br></br>  
                    <h:outputLabel value="#{msg.tarifa_m8}"  />
                    <br></br> 
                    <br></br>  
                    <h:outputLabel value="#{msg.tarifa_m9}"  />
                    <br></br> 
                    <br></br>  
                    <h:outputLabel value="#{msg.tarifa_m10}"  />
                </td> 
                </tr>
                <tr>
                    <td align="center">
                    
                        
                      
                          <a href="https://unianticapi.info">
    <input type="button" value="Salir" />
</a>
                        
     </td>
            </tr>
        </table>
    </h:form>
        
        <table align="center">
            <tr>
                <td>
                     <h:outputLabel value="#{msg.paypal}"  />
                   
                </td>
            </tr>
            <tr>
                <td>
                    <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_top">
                        <input type="hidden" name="cmd" value="_xclick"/>
                        <input type="hidden" name="business" value="XAMZDHW4HH8PU"/>
                        <input type="hidden" name="lc" value="ES"/>
                        <input type="hidden" name="button_subtype" value="services"/>
                        <input type="hidden" name="no_note" value="1"/>
                        <input type="hidden" name="no_shipping" value="1"/>
                        <input type="hidden" name="rm" value="1"/>
                        <input type="hidden" name="item_name" value="#{newJSFManagedBean.inscripcionActual.getIdInscripcion().toString()}"/>
                        <input type="hidden" name="amount" value="#{newJSFManagedBean.inscripcionActual.getImporteTotal().toString()}"/>
                        <input type="hidden" name="return" value="https://unianticapi.info"/>
                        <input type="hidden" name="cancel_return" value="https://inscripcion.unianticapi.info:8181/NOK.xhtml"/>
                        <input type="hidden" name="currency_code" value="EUR"/>
                        <input type="hidden" name="bn" value="PP-BuyNowBF:btn_buynowCC_LG.gif:NonHosted"/>
                        <input type="image" src="https://www.paypalobjects.com/es_ES/ES/i/btn/btn_buynowCC_LG.gif" name="submit" alt="PayPal. La forma rápida y segura de pagar en Internet."/>
                        <img alt="" border="0" src="https://www.paypalobjects.com/es_ES/i/scr/pixel.gif" width="1" height="1"/>
                    </form> 
                </td>
            </tr>
        </table>
         </f:view>
    </h:body>
</html>
