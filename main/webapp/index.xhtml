<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui" > 
    <h:head>
        <link rel="stylesheet" href="css.css"/>
        <link href="jquery.alerts.css" rel="StyleSheet" type="text/css" />
        <script src="jquery-1.4.2.min.js" type="text/javascript"></script>
        <script src="jquery.ui.draggable.js" type="text/javascript"></script>
        <script src="jquery.alerts.mod.js" type="text/javascript"></script>
        <script language="JavaScript">
            function test()
            {


                if (document.forms['ficha_inscripcion'].elements['ficha_inscripcion:correoElectronico'].value !==
                        document.forms['ficha_inscripcion'].elements['ficha_inscripcion:correoElectronico2'].value)
                {
                    alert("Los correos electrónicos no coinciden");
                    document.forms['ficha_inscripcion'].elements['ficha_inscripcion:correoElectronico'].value = '';
                    document.forms['ficha_inscripcion'].elements['ficha_inscripcion:correoElectronico2'].value = '';
                    return false;
                }
                if (document.forms['ficha_inscripcion'].elements['ficha_inscripcion:telefono'].value.length > 14)
                {
                    alert("El número de teléfono es demasiado largo, 14 caracteres máximo");

                    return false;
                }
                if (document.forms['ficha_inscripcion'].elements['ficha_inscripcion:observaciones'].value.length > 199)
                {
                    alert("El texto de la observaciones es demasiado largo, 190 caracteres máximo");
                    return false;
                }
                if (document.forms['ficha_inscripcion'].elements['ficha_inscripcion:otraOrganizacion'].value.length > 40)
                {
                    alert("El texto de organización es demasiado largo, 40 caracteres máximo");
                    return false;
                }

                if (document.forms['ficha_inscripcion'].elements['ficha_inscripcion:alergias'].value.length > 99)
                {
                    alert("El texto de alergias es demasiado largo, 99 caracteres máximo");
                    return false;
                }

                document.forms['ficha_inscripcion'].elements['correoElectronico2'].value = '';
                document.forms['ficha_inscripcion'].elements['duracionEstancia'].value = '';
            }

            function checkCookies() {
                var text = " ";
                document.forms['ficha_inscripcion'].elements['correoElectronico2'].value = text;
                document.forms['ficha_inscripcion'].elements['duracionEstancia'].value = text;
            }
            function borraCorreo() {
                var text = " ";
                document.forms['ficha_inscripcion'].elements['correoElectronico2'].value = text;
                document.forms['ficha_inscripcion'].elements['correoElectronico1'].value = text;
            }
        </script>
        <title>Inscripción Universidad de Verano Anticapitalista</title>
    </h:head>
    <h:body onload="borraCorreo()" class="fondo">
        <f:loadBundle basename="resources.mensajes" var="msg"  />
        <f:view >
            <h:form id="ficha_inscripcion" >

                <h2>
                    <p:outputLabel value="#{msg.convocatoria}"  />  
                </h2>
                <p:panelGrid columns="1" style="grid" > 
                    <p:column>
                        <p:outputLabel  value="#{msg.nomape}:" for="nombreApellido"  />
                        <p:inputText required="true" maxlength="90" size="80" id="nombreApellido" value="#{newJSFManagedBean.inscripcionActual.nombreApellidos}" title="Nombre y apellidos" requiredMessage="Los datos de nombre y apellidos son obligatorios" />
                        <p:message for="nombreApellido" style="color:red" />
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" > 
                    <p:column>    
                        <p:outputLabel value="#{msg.dni}" for="dniNie" />
                        <p:inputText  maxlength="20" required="true" id="dniNie" value="#{newJSFManagedBean.inscripcionActual.dniNie}" title="Número del DNI o NIE" requiredMessage="El número de DNI, NIE o pasaporte es obligatorio"/>
                        <p:message for="dniNie" style="color:red"  />
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" > 
                    <p:column>
                        <p:outputLabel value="&nbsp;&nbsp;#{msg.edad}" for="edad" />
                        <p:inputText id="edad" value="#{newJSFManagedBean.inscripcionActual.edad}" title="Edad" size="4" />
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" >
                    <p:column>
                        <p:outputLabel  value="#{msg.residencia}" for="ciudadResidencia" />               
                        <p:inputText maxlength="60" size = "60" required="true" id="ciudadResidencia" value="#{newJSFManagedBean.inscripcionActual.ciudadResidencia}" title="ciudadResidencia" requiredMessage="Tienes que indicar tu localidad de residencia"/>
                        <p:message for="ciudadResidencia" style="color:red"  />             
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" >
                    <p:column>
                        <p:outputLabel value="#{msg.email}" for="correoElectronico" />
                        <p:inputText required="true" id="correoElectronico"  value="#{newJSFManagedBean.inscripcionActual.correoElectronico}" title="Correo electrónico" requiredMessage="El dato del correo electrónico es obligatorio" 
                                     validatorMessage="Dirección de correo electrónico incorrecta" >
                            <f:validateRegex
                                pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
                        </p:inputText>
                        <p:message  for="correoElectronico" style="color:red" />
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" >
                    <p:column>
                        <p:outputLabel value="#{msg.email2}" for="correoElectronico2" />
                        <p:inputText required="true" id="correoElectronico2"  value="#{newJSFManagedBean.correoElectronico2}" title="Correo electrónico" requiredMessage="El correo electrónico no coincide">                                          


                        </p:inputText>
                        <p:message  for="correoElectronico2" style="color:red" />
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" >
                    <p:column>
                        <p:outputLabel  value="&nbsp;&nbsp;#{msg.telefono}" for="telefono" />
                        <p:inputText  id="telefono" value="#{newJSFManagedBean.inscripcionActual.telefono}"
                                      title="telefono" 
                                      required="false"  validatorMessage="El telefono introducido es demasido largo">
                        </p:inputText>
                        <p:message  for="telefono" style="color:red" />
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" >
                    <p:column>
                        <p:outputLabel value="&nbsp;&nbsp;#{msg.ccaa}:" for="ccaa" />
                        <p:selectOneMenu required="true" id = "ccaa" value="#{newJSFManagedBean.inscripcionActual.ccaa}">               
                            <f:selectItem itemLabel="CCAA" itemValue="#{null}"/>   
                            <f:selectItems value="#{newJSFManagedBean.muestraCCAA()}" var ="ccaa"
                                           itemLabel="#{ccaa.descCcaa}" 
                                           itemValue="#{ccaa.idCcaa}" />
                        </p:selectOneMenu> 
                        <p:message for="ccaa" style="color:red"  />
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" >
                    <p:column> 
                        <p:outputLabel value="#{msg.orientacion_alimentaria}" for="orientacionAlimentaria" />
                        <p:selectOneMenu required="true" id = "orientacionAlimentaria" value="#{newJSFManagedBean.inscripcionActual.orientacionAlimentaria}">               
                            <f:selectItem itemLabel="Selecciona un valor ..." itemValue="#{null}" noSelectionOption="true"/>   
                            <f:selectItems value="#{newJSFManagedBean.muestraOrientacionAlimentaria()}" var ="oriali"
                                           itemLabel="#{oriali.descOrientacionAlimentaria}" 
                                           itemValue="#{oriali.idOrientacionAlimentaria}" />
                        </p:selectOneMenu>  
                        <p:message for="orientacionAlimentaria" style="color:red"  />                          
                    </p:column>
                </p:panelGrid>
                <p:panelGrid columns="1" style="grid" >
                    <p:column >
                        <p:outputLabel value="#{msg.alergias}" />
                        <p:selectBooleanCheckbox id="alergiasBoolean" value="#{newJSFManagedBean.inscripcionActual.alergiasBoolean}">
                            <f:ajax event="change" execute="@this" render="perfbyselection6" />                           
                        </p:selectBooleanCheckbox>
                        <h:panelGroup id="perfbyselection6">
                            <p:outputLabel value="#{msg.alergias2}" rendered="#{newJSFManagedBean.inscripcionActual.alergiasBoolean}" />    
                            <p:inputText maxlength="70" size="60" id="alergias" value="#{newJSFManagedBean.inscripcionActual.alergias}" title="alergias" rendered="#{newJSFManagedBean.inscripcionActual.alergiasBoolean}"/>                         
                          <p:message for="alergias" style="color:red"  />      
                        </h:panelGroup>  
                    </p:column>
                     <p:column>
                        <p:outputLabel value="#{msg.lanzadera}" for="lanzadera" />
                        <p:selectBooleanCheckbox id="lanzadera" value="#{newJSFManagedBean.inscripcionActual.lanzadera}" title="lanzadera" />
                        <br></br>
                        <p:outputLabel value="#{msg.lanzadera2}" />
                        <h:outputLink value = "#{msg.lanzadera3}" target="_blank" > Lanzadera</h:outputLink>
                     </p:column>
                  
                    <p:column>                   
                            <p:outputLabel value="#{msg.guarderia}" for="guarderia" />
                            <p:selectBooleanCheckbox id = "guarderia" value="#{newJSFManagedBean.inscripcionActual.guarderia}">
                                <f:ajax event="change" execute="@this" render="perfbyselection4" />  
                            </p:selectBooleanCheckbox>  
                             <h:panelGroup id="perfbyselection4">
                                 <p:outputLabel value="#{msg.guarderia1}" for="ninio" rendered="#{newJSFManagedBean.inscripcionActual.guarderia eq true}" />
                                <p:inputText id="ninio" value="#{newJSFManagedBean.inscripcionActual.edadNinio}" title="edadNinio" rendered="#{newJSFManagedBean.inscripcionActual.guarderia eq true}"/>
                                <p:outputLabel value="#{msg.guarderia2}" for="tutor" rendered="#{newJSFManagedBean.inscripcionActual.guarderia eq true}" />
                                <p:inputText id="tutor" value="#{newJSFManagedBean.inscripcionActual.dniTutor}" title="dniTutor" rendered="#{newJSFManagedBean.inscripcionActual.guarderia eq true}"/>

                            </h:panelGroup>         
                          
                            
     </p:column> 
                    <p:column >
                        <p:outputLabel value="#{msg.ocupacion}" for="ocupacion" />
                        <p:selectOneMenu id = "ocupacion" value="#{newJSFManagedBean.inscripcionActual.ocupacion}">               
                            <f:selectItem itemLabel="Selecciona un valor ..." itemValue="#{null}" noSelectionOption="true"/>   
                            <f:selectItems value="#{newJSFManagedBean.listaOcupaciones}" var ="c"
                                           itemLabel="#{c.descOcupacion}" 
                                           itemValue="#{c.idOcupacion}" />
                            <f:ajax event="change" execute="@this" render="perfbyselection" />  
                        </p:selectOneMenu>
                        <h:panelGroup id="perfbyselection">
                            <p:outputLabel value="#{msg.ocupacion1}" for="otraOcupacion" rendered="#{newJSFManagedBean.inscripcionActual.ocupacion eq 13}" />
                            <p:inputText id="otraOcupacion" value="#{newJSFManagedBean.inscripcionActual.otraOcupacion}" maxlength="49" title="otraOcupacion" rendered="#{newJSFManagedBean.inscripcionActual.ocupacion eq 13}"/>
                        </h:panelGroup>
                    </p:column> 
                      <p:column>                 
                            <p:outputLabel value="#{msg.organizacion} " for="organizacion" />
                            <p:selectOneMenu id= "organizacion" value="#{newJSFManagedBean.inscripcionActual.organizacion}">               
                                <f:selectItem itemLabel="Selecciona un valor ..." itemValue="#{null}" noSelectionOption="true"/>  
                                <f:selectItems value="#{newJSFManagedBean.listaOrganizacion}" var ="organizacion"
                                               itemLabel="#{organizacion.descOrganizacion}" 
                                               itemValue="#{organizacion.idOrganizacion}" />
                                <f:ajax event="change" execute="@this" render="perfbyselection2" />  
                            </p:selectOneMenu>  
                  
                            <h:panelGroup id="perfbyselection2">
                                <p:outputLabel value="#{msg.organizacion1}" for="otraOrganizacion" rendered="#{newJSFManagedBean.inscripcionActual.organizacion eq 3}" />
                                <p:inputText id="otraOrganizacion" maxlength="99" value="#{newJSFManagedBean.inscripcionActual.otraOrganizacion}" title="otraOrganizacion" rendered="#{newJSFManagedBean.inscripcionActual.organizacion eq 3}"/>
                            </h:panelGroup>
                        

         <p:outputLabel value="#{msg.colabora}" for="" />
                            <p:selectBooleanCheckbox id = "colabora" value="#{newJSFManagedBean.inscripcionActual.colabora}">

                            </p:selectBooleanCheckbox> 
         </p:column> 
                    <p:column >             
         <p:outputLabel value="#{msg.sindicato}" for="" />
         <p:selectBooleanCheckbox id = "afiliacion_sindical" value="#{newJSFManagedBean.inscripcionActual.afiliacionSindical}">
             <f:ajax event="change" execute="@this" render="perfbyselection3" />  
         </p:selectBooleanCheckbox> 

         <h:panelGroup id="perfbyselection3">
             <p:outputLabel value="#{msg.sindicato1}" for="sindicato" rendered="#{newJSFManagedBean.inscripcionActual.afiliacionSindical eq true}" />
             <p:inputText id="sindicato" value="#{newJSFManagedBean.inscripcionActual.sindicato}" maxlength="39" title="sindicato" rendered="#{newJSFManagedBean.inscripcionActual.afiliacionSindical eq true}"/>
         </h:panelGroup>
     </p:column> 
                </p:panelGrid>
                <h:panelGrid columns="1" border="0" cellpadding="1" cellspacing="2">
                    <p:outputLabel  style="font-weight:bold" value="#{msg.estancia}" for="modalidadEstancia" />
                    <br></br>                            
                    <p:selectOneMenu  required="true" id="modalidadEstancia" value="#{newJSFManagedBean.inscripcionActual.modalidadEstancia}" requiredMessage="La modalidad de estancia es obligatoria">
                        <f:selectItem itemLabel="Selecciona un valor ..." itemValue="#{null}" noSelectionOption="true"/>   
                        <f:selectItems value="#{newJSFManagedBean.muestraModalidadEstancia(listaModalidadEstancia)}" var ="mEstancia"
                                       itemLabel="#{mEstancia.descModalidadEstancia}" 
                                       itemValue="#{mEstancia.idModalidadEstancia}" />
                        <p:ajax event="change" listener="#{newJSFManagedBean.calculaImporte()}" update="ImpCal"/>
                        <p:ajax update="containerGrid" event="change"/>  
                    </p:selectOneMenu>
                    <p:message for="modalidadEstancia" style="color:red" />
                </h:panelGrid> 
                <p:outputPanel id="containerGrid" layout="block">  
                    <p:panelGrid id="perfbyselection5" >
                        <br></br> 
                        <p:column>   
                            <h:outputLabel value="#{msg.dias}" for="duracionEstancia" rendered="#{newJSFManagedBean.inscripcionActual.modalidadEstancia eq 3 
                                                                                                 or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 4 
                                                                                                 or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 5
                                                                                                 or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 7 
                                                                                                 or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 8 
                                                                                                 or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 11}" />
                            <br></br>
                            <h:selectManyCheckbox  collectionType="java.util.ArrayList" style="width: 60px;"  required="true" id="listaDias" value="#{newJSFManagedBean.listaDias}"  rendered="#{newJSFManagedBean.inscripcionActual.modalidadEstancia eq 3 
                                                                                                                                                      or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 4 
                                                                                                                                                      or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 5 
                                                                                                                                                      or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 7 
                                                                                                                                                      or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 8 
                                                                                                                                                      or newJSFManagedBean.inscripcionActual.modalidadEstancia eq 11}" 
                                                   requiredMessage="Tienes que indicar por lo menos un día">

                                <f:selectItem itemLabel="#{msg.dia1}" itemValue='1' />
                                <f:selectItem itemLabel="#{msg.dia2}" itemValue='2' />
                                <f:selectItem itemLabel="#{msg.dia3}" itemValue='3' />
                                <f:selectItem itemLabel="#{msg.dia4}" itemValue='4' />
                                <f:selectItem itemLabel="#{msg.dia5}" itemValue='5' />
                                <p:ajax event="change" listener="#{newJSFManagedBean.calculaImporte()}" update="ImpCal"/>  

                            </h:selectManyCheckbox>
                            <p:message for="listaDias" style="color:red"  />
                        </p:column>   
                    </p:panelGrid>     
                    <h:panelGrid columns="1" style="grid" >
                        <p:column>
                            <p:outputLabel style="font-weight:bold" value="#{msg.tarifa}"  for="tarifa" />
                            <p:selectOneRadio id = "tarifas" required="true" layout="pageDirection" value="#{newJSFManagedBean.inscripcionActual.tarifa}" requiredMessage="Tienes que indicar a que tarifa te acoges">               
                                <f:selectItems id = "tarifa" value="#{newJSFManagedBean.muestraListaTarifa()}" var ="tarifa"
                                               itemLabel="#{tarifa.descTarifa}" 
                                               itemValue="#{tarifa.idTarifa}" 
                                               >
                                </f:selectItems>
                                <p:ajax event="change" listener="#{newJSFManagedBean.calculaImporte()}" update="ImpCal"/>
                            </p:selectOneRadio>
                            <p:message for="tarifas" style="color:red"  />
                        </p:column>
                    </h:panelGrid>
                    <p:panelGrid columns="1" style="grid" >
                        <p:column>
                            <h2>
                                <p:outputLabel  value="#{msg.importe}"  />           
                            </h2>
                            <h2>
                                <p:outputLabel style="color:red" id="ImpCal" value="#{newJSFManagedBean.getImporte_calculado().toString()}"  /> 
                                <p:outputLabel style="color:red" value="€"/>
                            </h2>
                        </p:column>
                        <p:column>            
                            <p:outputLabel style="font-size:15px" value="#{msg.observaciones}" for="observaciones" />
                            
                            <p:inputTextarea style="font-size:15px" maxlength="100" cols="100" rows="2" id="observaciones" value="#{newJSFManagedBean.inscripcionActual.observaciones}" title="Observaciones" />
                      </p:column>   
                    </p:panelGrid >  
                </p:outputPanel>
                <p:panelGrid columns="1" style="grid" >
                    <p:column style="text-align: center">


                        <p:outputLabel style="font-size:smaller" value="#{msg.consentimiento1}"  />

                        <p:outputLabel style="font-size:smaller" value="#{msg.consentimiento2}" />

                        <p:outputLabel style="font-size:smaller" value="#{msg.consentimiento3}" />


                        <br></br>
                        <h:outputLabel value="#{msg.consentimiento4}" />

                        <p:selectBooleanCheckbox  id="consentimiento" value="#{newJSFManagedBean.inscripcionActual.nodni}" requiredMessage="Debes manifestar consentimiento"> >
                            <f:validator validatorId="RequiredCheckboxValidator" />
                        </p:selectBooleanCheckbox>
                        <h:message for="consentimiento" style="color:red" />
                    </p:column>
                </p:panelGrid>

                <p:panelGrid columns="1" style="grid" >
                    <p:column>  
                        <h:outputLabel style="color:red" value="#{msg.transferencia1}" />

                        <h:outputLabel style="color:red" value="#{msg.transferencia2}" />
                        <br/>
                        <h:outputText value="#{msg.tarifa_m4}" style="font-size:20px;"/>
                        <h:outputText value="#{msg.tarifa_m5}" style="font-size:20px; "/>
                        <h:outputText value="#{msg.tarifa_m6}" style="font-size:20px; "/>
                        <br></br>
                        <h:outputText value="#{msg.tarifa_m3}" style="font-size:20px;"/>
                        <br>

                        </br>

                        <br></br>
                        <h:graphicImage id="capImg" value="#{facesContext.externalContext.requestContextPath}/../captcha.jpg"/>
                        <br></br>


                        <p:inputText value="#{newJSFManagedBean.validate}"/>

                        <p:commandButton action="#{newJSFManagedBean.execute}" value="#{msg.button_inscripcion}" onclick="return test()" />

                    </p:column> 
                </p:panelGrid>        


            </h:form> 
        </f:view> 
    </h:body>
</html>
